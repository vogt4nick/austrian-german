nav = [
  "index.md",
  "present-tense.md",
  "past-verb-tenses.md",
  "subjunctive-mood.md",
  "wishlist.md",
  "ear-training.md",
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/markup.js"]

[project.extra]
w4w = ':play_pause:{ title="Word for word with standard German vocabulary" }'
at = ':bootstrap-wappen-linz:{ title="Dialect" }'
de = ':flag_de:{ title="Standard German" }'
us = ':flag_us:{ title="Standard American English" }'

[project.extra.cite]
swick_grammar_drills = """\
  Swick, Ed. \
  [_German Grammar Drills._](https://www.amazon.com/dp/1264286104/) \
  Premium 4th Edition. \
  McGraw Hill, 2022."""
wolf_sog_amoi = """\
  Wolf, Manfred. \
  [_Sog amoi: Das etwas andere Mundartwörterbuch für Oberösterreich._](https://www.amazon.com/dp/3991132281) \
  1. Auflage. \
  TRAUNER Verlag + Buchservice GmbH, 2021."""

[project.extra.cc]
by = "[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.en)"
by_sa = "[CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.en)"

[project.theme]
variant = "classic"
language = "en"
features = ["navigation.indexes"]

[project.theme.icon]
annotation = "material/arrow-right-circle"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
smarty = {}
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.search]

[project.plugins.macros]
